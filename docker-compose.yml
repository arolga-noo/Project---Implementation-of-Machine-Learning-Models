version: '3.8'

services:
  scoring_api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: credit-card-ml-service:v1.0
    container_name: credit_api_container
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "5000"
    restart: always

  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx  # Логи будут сохраняться в локальную папку ./logs
    depends_on:
      - scoring_api
    restart: always
